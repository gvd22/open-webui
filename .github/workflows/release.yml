# ─────────────────────────────────────────────────────────────────────────────
# Release — Create GitHub release from CHANGELOG, trigger Docker builds
# Runs on pushes to main when package.json version changes
# ─────────────────────────────────────────────────────────────────────────────
name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── Create release and trigger downstream workflows ──────────────────────
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Abort if package.json unchanged
        run: |
          BEFORE="${{ github.event.before }}"
          CURRENT="${{ github.sha }}"
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "initial push has no parent commit; refusing an unverifiable release"
            exit 1
          fi
          if ! git cat-file -e "$BEFORE^{commit}"; then
            echo "push-before commit is unavailable; refusing an unverifiable release"
            exit 1
          fi
          set +e
          git diff --quiet "$BEFORE" "$CURRENT" -- package.json
          DIFF_STATUS=$?
          set -e
          if [ "$DIFF_STATUS" -eq 1 ]; then
            echo "package.json changed; continuing release"
          elif [ "$DIFF_STATUS" -eq 0 ]; then
            echo "package.json not modified; skipping release"
            exit 1
          elif [ "$DIFF_STATUS" -gt 1 ]; then
            echo "git diff failed with status $DIFF_STATUS; refusing release"
            exit "$DIFF_STATUS"
          fi

      - name: Read version
        id: pkg
        run: echo "version=$(jq -r '.version' package.json)" >> $GITHUB_OUTPUT

      - name: Extract release notes from CHANGELOG
        run: |
          VER="${{ steps.pkg.outputs.version }}"
          awk "/^## \[${VER}\]/{found=1; next} /^## \[/{if(found) exit} found{print}" \
            CHANGELOG.md > /tmp/release-notes.md

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "v${{ steps.pkg.outputs.version }}" &>/dev/null; then
            echo "Release v${{ steps.pkg.outputs.version }} already exists — skipping creation"
          else
            gh release create "v${{ steps.pkg.outputs.version }}" \
              --title "v${{ steps.pkg.outputs.version }}" \
              --notes-file /tmp/release-notes.md
          fi

      - name: Archive source
        uses: actions/upload-artifact@v4
        with:
          name: release-archive
          path: |
            .
            !.git
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger Docker build
        uses: actions/github-script@v8
        with:
          script: |
            github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'docker.yaml',
              ref: 'v${{ steps.pkg.outputs.version }}',
            })
