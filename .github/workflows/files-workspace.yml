name: Files Workspace

on:
  pull_request:
    paths:
      - 'src/lib/components/chat/Artifacts/**'
      - 'src/lib/components/chat/FileNav/**'
      - 'src/lib/components/chat/PyodideFileNav.svelte'
      - 'src/lib/components/chat/ChatControls.svelte'
      - 'src/lib/components/chat/Chat.svelte'
      - 'src/lib/components/chat/Messages/CodeBlock.svelte'
      - 'src/lib/components/chat/Navbar.svelte'
      - 'src/lib/components/common/**'
      - 'src/lib/pyodide/**'
      - 'src/lib/workers/pyodide.worker.ts'
      - 'src/lib/stores/**'
      - 'src/lib/utils/excelToTable.ts'
      - 'src/routes/+layout.svelte'
      - 'backend/open_webui/env.py'
      - 'backend/open_webui/config.py'
      - 'backend/open_webui/main.py'
      - 'scripts/prepare-pyodide.js'
      - 'tests/**'
      - 'scripts/*viewer*'
      - 'package*.json'
      - 'playwright.config.ts'
      - 'vite.config.ts'
      - '.github/workflows/files-workspace.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  files:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --force
      - run: npm run test:viewer
      - run: npm run test:viewer:contracts
      - run: node --test tests/fixtures/document-viewer/manifest.test.mjs
      - run: python tests/fixtures/document-viewer/generator.test.py
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:viewer:e2e
      - run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=8192
      - run: npm run check:viewer:bundle
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: files-workspace-failures
          path: test-results/
          retention-days: 7
